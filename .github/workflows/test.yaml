name: Run Tests
run-name: Run Tests on ${{ github.repository }}@${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches: # This refers to base branches (i.e. what you are trying to merge into)
      - main
  workflow_dispatch:

permissions:
  checks: write # Permissions to write check annotations
  contents: read # Permissions needed for clippy-check and rustfmt-check

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # validate:
