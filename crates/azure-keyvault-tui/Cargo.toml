[package]
name = "azure-keyvault-tui"
description = "A TUI application to manage data across multiple Azure KeyVaults."
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository = "https://github.com/aisamji/azure-keyvault-tui/tree/main/crates/azure-keyvault-tui"

[dependencies]
azure-keyvault-tui-macros = { path = "../azure-keyvault-tui-macros", version = "0.1.0" }

crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.29.0"
tokio = { version = "1.44.2", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
] }
clap.workspace = true
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0.98"
dirs = "6.0.0"
reqwest = { version = "0.12", features = ["json"] }
azure_core = "0.24"
azure_identity = "0.24"
